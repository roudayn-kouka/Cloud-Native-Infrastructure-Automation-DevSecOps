{{- $b := .Values.backend }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense.labels" . | nindent 4 }}
    {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 4 }}
    tier: app
spec:
  {{- if not $b.hpa.enabled }}
  replicas: {{ $b.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 8 }}
        tier: app
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "expense.podSecurityContext" . | nindent 8 }}
        runAsUser: 1000
        runAsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: {{ include "expense.image" (dict "root" . "image" $b.image) | quote }}
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $b.port }}
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: DB_USER
            - name: DB_PWD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret.name }}
                  key: DB_PWD
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- include "expense.containerSecurityContext" . | nindent 12 }}
            readOnlyRootFilesystem: true
