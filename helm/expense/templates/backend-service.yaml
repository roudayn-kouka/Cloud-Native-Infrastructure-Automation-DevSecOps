apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense.labels" . | nindent 4 }}
    {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
