{{- if .Values.networkPolicy.enabled }}
# Default: deny all ingress inside the namespace, then allow only what is needed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# ALB (VPC address space) -> frontend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "expense.selectorLabels" (dict "name" "frontend" "root" .) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.vpcCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
---
# frontend (nginx proxy) and Prometheus -> backend
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-and-monitoring-to-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "expense.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "expense.selectorLabels" (dict "name" "backend" "root" .) | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "expense.selectorLabels" (dict "name" "frontend" "root" .) | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.backend.port }}
{{- end }}
